# otkritka — host nginx vhost. Образец снят с videocard (foto-clip.ru).
# Закрытый режим (решение сессии): Basic Auth на весь сайт + X-Robots-Tag:
# noindex на все ответы. Это замена ненаписанному staging-гейту приложения
# (Ч-18/V13): до готовности этап 7 прод в индекс не открывается.

# --- HTTP: ACME + принудительный редирект на HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dobrye-otkrytki.ru www.dobrye-otkrytki.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dobrye-otkrytki.ru$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dobrye-otkrytki.ru www.dobrye-otkrytki.ru;

    ssl_certificate /etc/letsencrypt/live/dobrye-otkrytki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dobrye-otkrytki.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Закрытие от индексации и публичного доступа (весь сайт).
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_basic "otkritka (closed)";
    auth_basic_user_file /etc/nginx/.htpasswd-otkritka;

    client_max_body_size 25m;
    client_body_timeout 300s;

    # Единственный хост: www -> apex (правило «ровно один хост на весь сайт»).
    if ($host = www.dobrye-otkrytki.ru) {
        return 301 https://dobrye-otkrytki.ru$request_uri;
    }

    # Обновление сертификата без авторизации.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # Админка и API Payload — контейнер cms.
    location /admin {
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }
    location /api {
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }

    # Сайт и отдача /media — контейнер web.
    location / {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }
}
