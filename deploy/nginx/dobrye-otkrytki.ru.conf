# otkritka — host nginx vhost. Образец снят с videocard (foto-clip.ru).
# Basic Auth на публичной части снят по решению человека (2026-10-02), на
# админке и API Payload — оставлен. Закрытие от индексации держится только на
# X-Robots-Tag: noindex, nofollow (Ч-18/V13) — снимать его отдельным решением.
#
# auth_basic на /admin и /api — с ОДНИМ realm: панель админки обращается к /api
# из браузера, и при разных realm браузер не переиспользует введённые логин и
# пароль, то есть XHR панели получают 401 без шанса на запрос пароля.

# --- HTTP: ACME + принудительный редирект на HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dobrye-otkrytki.ru www.dobrye-otkrytki.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dobrye-otkrytki.ru$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dobrye-otkrytki.ru www.dobrye-otkrytki.ru;

    ssl_certificate /etc/letsencrypt/live/dobrye-otkrytki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dobrye-otkrytki.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Закрытие от индексации (весь сайт). Публичный доступ открыт.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 25m;
    client_body_timeout 300s;

    # Единственный хост: www -> apex (правило «ровно один хост на весь сайт»).
    if ($host = www.dobrye-otkrytki.ru) {
        return 301 https://dobrye-otkrytki.ru$request_uri;
    }

    # Обновление сертификата. auth_basic off — страховка: если Basic Auth снова
    # повесят на весь server-блок, продление не должно падать молча.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # MCP-вход внешней LLM (решение Ч-35). `auth_basic off` НАМЕРЕННО: клиент не
    # может предъявить одновременно Basic и собственный токен — заголовок
    # Authorization один, и Basic его занимает. Это единственное снятие Basic
    # Auth во всей конфигурации, кроме ACME-челленджа.
    #
    # СОВПАДЕНИЕ ТОЧНОЕ (`=`), А НЕ ПРЕФИКСНОЕ. Сначала стояло `^~ /api/mcp`, и
    # это открывало наружу лишнее: префикс не ограничен границей сегмента, поэтому
    # под снятый Basic Auth попадали и `/api/mcpx`, и `/api/mcp-cokhranennoe`, и
    # `/api/mcp/<что угодно>` — то есть будущая коллекция с именем на `mcp`
    # оказалась бы доступна анонимно. Ручка живёт по ОДНОМУ адресу, поэтому и
    # локаций ровно две: сам адрес и его форма с завершающим слешем, которую Next
    # отдаёт одиночным 308 на адрес без слеша. Всё остальное `/api/mcp…` падает
    # обратно в `location /api` под Basic Auth.
    #
    # Что защищает ручку вместо Basic Auth: Bearer-токен, равный API-ключу
    # аккаунта (отзыв ключа кнопкой в админке выключает и MCP), ограничение
    # частоты на ключ (Ч-14 — распознаёт и схему Bearer, поэтому MCP и прямой REST
    # с одним ключом делят один бакет), отдельный предел неудачных попыток на
    # адрес (ключ бакета — `X-Real-IP` от этого прокси, не подделываемый клиентом),
    # одинаковый ответ 401 на все причины отказа и выключатель MCP_ENABLED,
    # который по умолчанию ВЫКЛЮЧЕН: пока он не выставлен в true, ручка отдаёт
    # 404 и своего существования не подтверждает.
    location = /api/mcp {
        auth_basic off;
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }
    location = /api/mcp/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }

    # Админка и API Payload — контейнер cms. Закрыты Basic Auth поверх
    # авторизации Payload. Путь админки должен совпадать с PAYLOAD_ADMIN_PATH
    # из otkritka.prod.env: при нестандартном значении правь и location.
    location /admin {
        auth_basic "otkritka admin";
        auth_basic_user_file /etc/nginx/.htpasswd-otkritka;
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }
    location /api {
        auth_basic "otkritka admin";
        auth_basic_user_file /etc/nginx/.htpasswd-otkritka;
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }

    # Статика панели: Payload 3 = Next, assetPrefix и basePath не заданы, поэтому
    # чанки лежат в корне по /_next/*. Без этой локации они уходят в Astro и
    # отдают 404 — панель не загружается. Realm тот же.
    location /_next {
        auth_basic "otkritka admin";
        auth_basic_user_file /etc/nginx/.htpasswd-otkritka;
        proxy_pass http://127.0.0.1:3011;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }

    # Сайт и отдача /media — контейнер web.
    location / {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/otkritka-proxy.conf;
    }
}
