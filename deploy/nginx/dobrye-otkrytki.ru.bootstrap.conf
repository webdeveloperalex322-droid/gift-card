# Временный vhost ТОЛЬКО для выпуска сертификата (нет ссылок на cert, nginx -t
# проходит без него). После certbot заменяется на dobrye-otkrytki.ru.conf.
server {
    listen 80;
    listen [::]:80;
    server_name dobrye-otkrytki.ru www.dobrye-otkrytki.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "otkritka acme bootstrap\n";
        add_header Content-Type text/plain;
    }
}
